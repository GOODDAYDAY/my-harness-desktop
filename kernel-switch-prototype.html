<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内核切换动画 · 低保真</title>
<style>
  :root {
    --bg: #1e1f22;
    --surface: #2b2d31;
    --border: #3a3d42;
    --fg: #e6e6e6;
    --muted: #9aa0a6;
    --primary: #5b8cff;
    --motion-duration-normal: 200ms;
    --motion-ease-emphasized: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #111214; color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px;
  }
  .app {
    width: 720px; max-width: 100%; background: var(--bg);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; height: 600px;
  }
  .header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .header .title { font-size: 14px; font-weight: 600; }
  .kernel-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); }
  .kernel-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #f0b429; transition: background 200ms; }
  .kernel-badge.dsh .dot { background: #38bdf8; }

  /* 消息区 —— 与真实实现一致的过渡:opacity + translateY(4px),200ms emphasized */
  .messages-wrap { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  .messages {
    flex: 1; overflow: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px;
    opacity: 1; transform: translateY(0);
    transition: opacity var(--motion-duration-normal) var(--motion-ease-emphasized),
                transform var(--motion-duration-normal) var(--motion-ease-emphasized);
  }
  .messages.switching { opacity: 0; transform: translateY(4px); }
  .msg { max-width: 78%; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; }
  .user .bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .model-line { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
  .k { font-weight: 700; }
  .k.pi { color: #f0b429; }
  .k.dsh { color: #38bdf8; }

  /* 切换 overlay:spinner + 随机句 */
  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
  .overlay.show { display: flex; }
  .spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); border-top-color: transparent; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .overlay .text { font-size: 13px; color: var(--muted); }
  .overlay .idx { font-size: 11px; color: var(--muted); opacity: 0.55; }

  /* composer */
  .composer { padding: 12px 16px; border-top: 1px solid var(--border); }
  .composer-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  .composer-box .input { flex: 1; color: var(--muted); font-size: 14px; }
  .dropdown { position: relative; }
  .model-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer; }
  .menu { position: absolute; bottom: 38px; right: 0; width: 240px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.45); display: none; z-index: 10; }
  .menu.open { display: block; }
  .menu .group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 5px 8px 3px; display: flex; align-items: center; gap: 5px; }
  .menu .item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .menu .item:hover { background: rgba(255,255,255,0.06); }
  .menu .item .name { flex: 1; }
  .menu .item .check { visibility: hidden; color: var(--primary); }
  .menu .item.current .check { visibility: visible; }

  .hint { width: 720px; max-width: 100%; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .hint b { color: var(--fg); }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">会话页 · 时间线</div>
      <div class="kernel-badge" id="kernelBadge"><span class="dot"></span><span id="kernelLabel">pi</span></div>
    </div>

    <div class="messages-wrap">
      <div class="messages" id="messages">
        <div class="msg user">
          <div class="bubble">帮我看看这个项目的依赖是不是有问题</div>
        </div>
        <div class="msg assistant">
          <div class="model-line"><span class="k pi" id="msgKernel">pi</span><span id="msgModel">claude-sonnet-4</span></div>
          <div class="bubble">我先读一下 package.json 和 lock 文件，再给你结论。</div>
        </div>
      </div>

      <div class="overlay" id="overlay">
        <div class="spinner"></div>
        <div class="text" id="overlayText">正在切换内核…</div>
        <div class="idx" id="overlayIdx"></div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-box">
        <div class="input">给 agent 发消息…</div>
        <div class="dropdown">
          <button class="model-btn" id="modelBtn">
            <span class="k pi" id="btnKernel">pi</span>
            <span id="btnModel">claude-sonnet-4</span>
            <span>▾</span>
          </button>
          <div class="menu" id="menu"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hint">
    <b>这是什么：</b>之前给你做的「跨内核切换动画」低保真。点右下角模型按钮 → 选 <b>dsh</b> 组里的模型，或再切回 <b>pi</b>，看消息流怎么过渡。<br>
    <b>动画分三拍：</b>旧消息 fade-out（透明度 + 下移 4px，200ms）→ 中间随机弹一句提示（20 句里抽）→ 新消息 fade-in。同内核换模型不触发动画。
  </div>

<script>
  const PHRASES = [
    "正在切换内核…", "正在更换模型底座…", "稍等，正在热切换…", "正在迁移会话上下文…",
    "切换中，马上就好…", "正在唤醒新的内核…", "正在交接上下文…", "换个底座，稍等片刻…",
    "正在重新接线…", "正在切换模型引擎…", "正在加载新内核…", "稍等，正在换引擎…",
    "正在衔接上下文…", "正在为会话切换内核…", "正在换挡，请稍候…", "正在重新挂载…",
    "换个内核，继续聊…", "正在同步上下文…", "切换底座中，进度不丢…", "正在切换，稍等片刻…",
  ];

  // 模型清单(带 kernel 标,和真实 model-catalog 合流清单同构)
  const MODELS = [
    { kernel: "pi",  provider: "anthropic", id: "claude-sonnet-4",  name: "claude-sonnet-4" },
    { kernel: "pi",  provider: "anthropic", id: "claude-opus-4",    name: "claude-opus-4" },
    { kernel: "dsh", provider: "deepseek",  id: "deepseek-chat",    name: "deepseek-chat" },
    { kernel: "dsh", provider: "deepseek",  id: "deepseek-reasoner", name: "deepseek-reasoner" },
  ];

  let current = MODELS[0]; // 当前模型(pi)
  let busy = false;

  const $ = (id) => document.getElementById(id);

  function renderMenu() {
    const kernels = ["pi", "dsh"];
    $("menu").innerHTML = kernels.map((k) => {
      const items = MODELS.filter((m) => m.kernel === k);
      return `
        <div class="group-label"><span class="k ${k}">${k}</span> · ${items[0].provider}</div>
        ${items.map((m) => `
          <div class="item ${m.id === current.id ? 'current' : ''}" data-id="${m.id}">
            <span class="k ${m.kernel}">${m.kernel}</span>
            <span class="name">${m.name}</span>
            <span class="check">✓</span>
          </div>`).join("")}
      `;
    }).join("");
  }

  function applyModel(m) {
    current = m;
    // 顶栏 + 按钮 + 助手消息行 的内核标/模型名同步更新
    $("kernelBadge").className = "kernel-badge" + (m.kernel === "dsh" ? " dsh" : "");
    $("kernelLabel").textContent = m.kernel;
    $("btnKernel").className = "k " + m.kernel;
    $("btnKernel").textContent = m.kernel;
    $("btnModel").textContent = m.name;
    $("msgKernel").className = "k " + m.kernel;
    $("msgKernel").textContent = m.kernel;
    $("msgModel").textContent = m.name;
    renderMenu();
  }

  function switchKernel(m) {
    // 同内核:直接换模型,不动画(与真实 pickModel 一致)
    if (m.kernel === current.kernel) { applyModel(m); return; }

    const idx = Math.floor(Math.random() * PHRASES.length);
    const phrase = PHRASES[idx];

    // 1. 淡出旧消息
    $("messages").classList.add("switching");
    $("overlayText").textContent = phrase;
    $("overlayIdx").textContent = `第 ${idx + 1} / ${PHRASES.length} 句`;
    $("overlay").classList.add("show");

    // 2. 模拟 switchKernel + setModel + sync(真实耗时取决于 spawn/seed)
    setTimeout(() => {
      applyModel(m);
      // 3. 淡入新消息
      $("messages").classList.remove("switching");
      $("overlay").classList.remove("show");
    }, 1100);
  }

  // 模型按钮开合菜单
  $("modelBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    $("menu").classList.toggle("open");
    renderMenu();
  });
  document.addEventListener("click", () => $("menu").classList.remove("open"));
  $("menu").addEventListener("click", (e) => {
    const item = e.target.closest(".item");
    if (!item) return;
    const m = MODELS.find((x) => x.id === item.dataset.id);
    if (m) switchKernel(m);
    $("menu").classList.remove("open");
  });

  applyModel(current);
</script>
</body>
</html>
