# electron-builder 三端打包配置 —— 一条命令出 mac/Windows/Linux 安装包。
#
# 资源落点(与 bootstrap/installer 的 app.isPackaged 分支一一对应):
#   resources/my-harness-desktop-builtin/  ← src/plugins(内置插件 manifest+资产;renderer 代码已静态进 bundle)
#   resources/my-harness-desktop-skills/   ← .claude/skills(内置 skills 源,启动镜像到数据根 skills/)
#   resources/my-harness-desktop-stickers/ ← assets/stickers(内置表情包源,启动镜像到数据根 stickers/bundled/)
#   resources/pi-my-harness-fit-pi-extension/ ← packages/my-harness-fit-pi-extension(统一底座扩展源,含 tools/ + skills/)
#
# 数据目录分流(client/paths):打包态读 ~/.my-harness-desktop,dev 态读 ~/.my-harness-desktop-dev。
appId: works.earendil.my-harness-desktop
productName: My Harness Desktop
# 产物文件名用 ASCII(π 在脚本/拷贝/CI 里是 unicode 坑);安装后显示名仍是 My Harness Desktop。
artifactName: my-harness-desktop-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 earendil-works

asar: true
# 无原生模块(electron-store/chokidar/tar 全纯 JS),跳过重编译。
npmRebuild: false

files:
  - out/**
  - package.json
  # BrowserWindow icon / dock.setIcon 读 asar 内 assets/icons/icon.png
  - assets/icons/**

extraResources:
  # 内置插件:manifest/locales/skills/md 等运行时资产;ts/tsx 源码不打(renderer 已静态进 bundle)
  # 例外:pi-extension/ 下的 .ts 是底座扩展源码,由 piExtensionEnsure 同步进底座,必须随壳分发
  - from: src/plugins
    to: my-harness-desktop-builtin
    filter:
      - "**/*"
      - "!**/*.ts"
      - "!**/*.tsx"
      - "**/pi-extension/**/*.ts"
  - from: .claude/skills
    to: my-harness-desktop-skills
  - from: assets/stickers
    to: my-harness-desktop-stickers
  - from: packages/my-harness-fit-pi-extension
    to: pi-my-harness-fit-pi-extension
  # dsh 适配插件源(ask/goal/read-claude-md/skill-manager/llm-recorder 五个 dsh cordis 插件合并成一块,
  # 由 dshExtensionEnsure 同步进 ~/.dsh/.my-harness-desktop-plugins/)。
  # **路径曾长期写成已不存在的 src/client/dsh/dsh-extension**(前后端分离搬迁后没同步)——
  # 打包产物因此**不带 dsh 扩展**,而 dev 态路径是对的,所以本地怎么跑都发现不了。
  # 现行守卫:src/packaging-paths.test.ts 逐条校验本文件每个 from: 指向真实存在的路径。
  - from: src/server/kernel/dsh/extension/dsh-extension
    to: my-harness-desktop-dsh-extension
  # minimal 内核本体(.mjs 独立 CLI + 模型/工具/插件模块,spawn 用;相对 import 须整目录同层拷贝)
  - from: src/server/kernel/minimal/kernel
    to: minimal-kernel
    filter:
      - "**/*.mjs"

mac:
  category: public.app-category.developer-tools
  icon: assets/icons/icon.icns
  target:
    - dmg
    - zip
  # 自分发未签名:首次打开经 右键→打开 过 Gatekeeper;签名/公证是另一摊事(需开发者证书)。
  identity: null

win:
  # 1024x1024 png,electron-builder 自动转 ico。
  icon: assets/icons/icon.png
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: My Harness Desktop

linux:
  category: Development
  icon: assets/icons/icon.png
  # deb 元数据需要 maintainer(author 无 email 时的替代)。
  maintainer: earendil-works
  target:
    - AppImage
    - deb
